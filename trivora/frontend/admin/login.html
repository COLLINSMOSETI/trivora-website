<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin sign in | Trivora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-body">
  <div class="bg" aria-hidden="true"><div class="bg-gradient"></div><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

  <main class="login-card">
    <div class="login-brand">
      <svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true"><defs><linearGradient id="lgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="40" height="40" rx="10" fill="url(#lgl)"/><path d="M11 12h18M20 12v17" stroke="#fff" stroke-width="3.6" stroke-linecap="round" fill="none"/><circle cx="29" cy="29" r="2.6" fill="#fff"/></svg>
      <div><strong>Trivora</strong><span>Admin dashboard</span></div>
    </div>

    <h1>Sign in</h1>
    <p class="muted">See your enquiries and website visitors.</p>

    <div class="alert" id="loginError" role="alert" hidden></div>

    <form id="loginForm" autocomplete="on">
      <label>Username<input type="text" name="username" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
    </form>

    <a class="back" href="../index.html">&larr; Back to website</a>
  </main>

  <script type="module" src="../js/admin/login.js"></script>
</body>
</html>
